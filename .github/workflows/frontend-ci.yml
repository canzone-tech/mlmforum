name: Frontend CI
on:
  push:
    branches: [dev/local-foundation]
  pull_request:
    branches: [dev/local-foundation]
permissions:
  contents: write # needed only to commit the first generated npm lockfile on approved dev branch
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initial lockfile bootstrap (dev branch only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then exit 0; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" add package-lock.json
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "chore: lock initial frontend dependencies"
          git push origin HEAD:dev/local-foundation
          echo "Lockfile committed. Verification must re-run on its new SHA." >&2
          exit 1
      - name: Require committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Build, startup, routes and real-browser UAT
        run: npm run verify:frontend
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
