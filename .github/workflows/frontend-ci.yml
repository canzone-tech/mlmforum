name: Frontend CI
on:
  push:
    branches: [dev/local-foundation]
  pull_request:
    branches: [dev/local-foundation]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducible locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Lint, types, tests, build and compiled-browser UAT
        run: npm run verify:frontend
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
