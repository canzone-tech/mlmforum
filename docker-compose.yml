services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mlmforum_test
      MYSQL_USER: mlmforum
      MYSQL_PASSWORD: local-test-only-password
      MYSQL_ROOT_PASSWORD: local-root-test-only-password
    ports:
      - "127.0.0.1:33067:3306"
    volumes:
      - mlmforum_mysql_test:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -u mlmforum -p$$MYSQL_PASSWORD --silent"]
      interval: 4s
      timeout: 4s
      retries: 30
volumes:
  mlmforum_mysql_test:
